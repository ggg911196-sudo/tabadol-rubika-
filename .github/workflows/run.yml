name: Rubika Bot 24/7

on:
  workflow_dispatch: # امکان روشن کردن دستی
  schedule:
    - cron: '0 */5 * * *' # اجرای خودکار هر ۵ ساعت یک‌بار

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کدهای ربات
        uses: actions/checkout@v3

      - name: نصب پایتون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: نصب پیش‌نیازها
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: اجرای ربات روبیکا
        run: |
          # ربات ۴ ساعت و ۵۵ دقیقه روشن می‌ماند و بعد تمیز بسته می‌شود
          timeout 17700s python main.py || true
